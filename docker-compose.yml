version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: kisanclaim_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kisanclaim
      POSTGRES_USER: kisan_admin
      POSTGRES_PASSWORD: kisan_password_secure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisanclaim_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://kisan_admin:kisan_password_secure@db:5432/kisanclaim
      - SECRET_KEY=kisanclaim-production-key-2026-hackathon
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/generated_reports:/app/generated_reports
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kisanclaim_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
